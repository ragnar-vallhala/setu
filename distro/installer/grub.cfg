# GRUB menu of the Setu installer ISO (grub-mkrescue's EFI image loads it).
# live-boot finds /live/filesystem.squashfs on the medium (boot=live).
# "Install Setu" boots quietly behind the boot splash (Plymouth; see
# rootfs/etc/default/grub.d/setu.cfg); the safe-graphics entry shows the
# kernel messages and no splash.
set timeout=3
set default=0
serial --speed=115200
terminal_input console serial
terminal_output console serial

menuentry "Install Setu" {
    linux /live/vmlinuz boot=live quiet splash loglevel=3 plymouth.ignore-serial-consoles console=tty1 console=ttyS0,115200
    initrd /live/initrd.img
}
menuentry "Install Setu (safe graphics)" {
    linux /live/vmlinuz boot=live nomodeset console=tty1 console=ttyS0,115200
    initrd /live/initrd.img
}
menuentry "UEFI firmware settings" {
    fwsetup
}
