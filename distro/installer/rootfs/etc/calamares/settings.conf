# Calamares on the Setu live system: the installer (distro/README.md,
# "Installer ISO"). It asks only which disk to erase; language, keyboard,
# time zone, the admin account and the computer name are asked on the
# installed system's first boot (/usr/share/setu/firstboot/calamares, which
# shellprocess@target puts in the target's /etc/calamares).
# Docs: Calamares settings.conf (3.3), Debian's calamares-settings-debian.
---
modules-search: [ local ]

instances:
- id:     cvol
  module: shellprocess
  config: shellprocess-cvol.conf
- id:     target
  module: shellprocess
  config: shellprocess-target.conf
- id:     done
  module: shellprocess
  config: shellprocess-done.conf

sequence:
- show:
  - welcome
  - partition
  - summary
- exec:
  - partition
  - mount
  - shellprocess@cvol
  - unpackfs
  - machineid
  - fstab
  - packages
  - shellprocess@target
  - initramfs
  - bootloader
  - shellprocess@done
  - umount
- show:
  - finished

branding: setu
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
