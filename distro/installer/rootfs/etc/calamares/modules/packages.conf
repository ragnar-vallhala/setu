# Remove the live-only packages from the installed copy (offline: no
# package lists are updated). Calamares stays: it is the first-boot wizard.
# Docs: Calamares src/modules/packages/packages.conf (3.3), Debian's
# calamares-settings-debian.
---
backend: apt
skip_if_no_internet: false
update_db: false
update_system: false
operations:
  - remove:
      - live-boot
      - live-boot-initramfs-tools
