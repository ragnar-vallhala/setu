# GRUB on the ESP, with an NVRAM entry ("Setu", the branding's
# bootloaderEntryName) and the removable fallback path. The kernel command
# line comes from /etc/default/grub.d/setu.cfg in the image.
# Docs: Calamares src/modules/bootloader/bootloader.conf (3.3)
---
efiBootLoader: "grub"
kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
installEFIFallback: true
