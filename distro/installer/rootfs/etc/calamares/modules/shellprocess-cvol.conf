# After mounting the new partitions: make the C: volume the casefold system
# volume (setu-cvol-init, shared with the dev image build). Runs on the live
# system. Docs: Calamares src/modules/shellprocess/shellprocess.conf (3.3)
---
dontChroot: true
timeout: 120
script:
    - "/usr/lib/setu/setu-install cvol ${ROOT}"
i18n:
    name: "Preparing the C: volume"
