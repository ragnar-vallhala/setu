# Writes /etc/default/keyboard (setu-firstboot-finish passes it to the
# session) and the console keymap. Docs: Calamares
# src/modules/keyboard/keyboard.conf (3.3)
---
xOrgConfFileName: "/etc/X11/xorg.conf.d/00-keyboard.conf"
convertedKeymapPath: "/lib/kbd/keymaps/xkb"
writeEtcDefaultKeyboard: true
configure:
    kwin: false
