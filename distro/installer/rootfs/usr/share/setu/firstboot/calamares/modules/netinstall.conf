# First-boot wizard: the "Remote login" page, one checkbox, off by default.
# Calamares has no plain checkbox page; netinstall's group tree is one.
# The page only records the ticked group's package (openssh-server, already
# installed) in GlobalStorage; there is no packages job. The remotelogin job
# (modules/remotelogin/) reads it and runs setu-firstboot-ssh, which enables
# and starts sshd. Unticked, sshd stays disabled (setu-install target turns
# it off on the installed system).
---
groupsUrl: local
required: false
label:
    sidebar: "Remote login"
    title: "Remote login"
groups:
    - name: "Enable remote login (SSH)"
      description: "Lets you log in to this computer over the network with your account's password (OpenSSH server)."
      selected: false
      critical: false
      expanded: false
      packages:
          - openssh-server
