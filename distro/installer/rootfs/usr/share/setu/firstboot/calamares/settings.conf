# Calamares as Setu's first-boot wizard: OEM mode on the installed system
# (dont-chroot: every job works on the running system). The installer copies
# this directory to the target's /etc/calamares (setu-install target);
# setu-firstboot.service runs it before the session, and its last job
# (setu-firstboot-finish) removes it again.
# Docs: Calamares settings.conf (3.3): dont-chroot, oem-setup.
---
# Calamares' own modules, and ours (the remotelogin job) next to the config
modules-search: [ local, /etc/calamares/modules ]

instances:
- id:     finish
  module: shellprocess
  config: shellprocess-finish.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - users
  - netinstall
  - summary
- exec:
  - locale
  - keyboard
  - localecfg
  - users
  - remotelogin
  - shellprocess@finish
- show:
  - finished

branding: setu
prompt-install: false
dont-chroot: true
oem-setup: true
disable-cancel: true
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: true
