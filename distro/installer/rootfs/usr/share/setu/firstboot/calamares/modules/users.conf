# The Setu admin account and the computer name. The account is in sudo
# (Calamares writes /etc/sudoers.d/10-installer) and the groups the
# session needs; root stays locked. Setu always logs this account in
# (setu-session.service), so the autologin box is pre-checked.
# Docs: Calamares src/modules/users/users.conf (3.3)
---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - name: sudo
      must_exist: true
      system: true
    - name: video
      must_exist: true
      system: true
    - name: render
      must_exist: true
      system: true
    - name: input
      must_exist: true
      system: true
    - name: audio
      must_exist: true
      system: true
sudoersGroup: sudo
autologinGroup: ""
doAutologin: true
setRootPassword: false
doReusePassword: false
passwordRequirements:
    minLength: 4
    maxLength: -1
allowWeakPasswords: false
user:
    shell: /bin/bash
    forbidden_names: [ root, nobody ]
    home_permissions: "o700"
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "${first}-setu"
    forbidden_names: [ localhost ]
presets:
    fullName:
        editable: true
    loginName:
        editable: true
