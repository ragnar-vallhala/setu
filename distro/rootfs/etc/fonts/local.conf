<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Setu's fonts (docs/DESIGN.md): Inter for the generic sans-serif family and
  JetBrains Mono for monospace, DejaVu as the fallback for characters they
  lack. This is what Linux programs (Calamares, foot, labwc) get; Windows
  programs get Inter through the personality's FontSubstitutes (wine.inf).
  Rendering: antialiased, slight hinting, grayscale (no subpixel colour
  fringes; the session draws in software through Xwayland, often viewed
  scaled in a VM window).
-->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
