# Setu: a quiet boot. The GRUB menu stays hidden (hold Shift or press Esc
# during the one-second wait to see it), the kernel and systemd keep their
# messages off the screen and the boot splash (Plymouth, theme "setu") shows
# instead. Everything still goes to the serial port (the smoke tests read
# it): console=ttyS0 is the last console, so /dev/console and the units'
# StandardOutput=journal+console write there; plymouth.ignore-serial-consoles
# keeps Plymouth's graphical splash on the screen despite the serial console.
GRUB_TIMEOUT=1
GRUB_TIMEOUT_STYLE=hidden
GRUB_DISTRIBUTOR="Setu"
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 plymouth.ignore-serial-consoles"
GRUB_CMDLINE_LINUX="console=tty1 console=ttyS0,115200"
GRUB_TERMINAL="console serial"
GRUB_SERIAL_COMMAND="serial --speed=115200"
