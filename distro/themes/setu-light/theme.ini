; Setu Light, the default theme pack: the tokens of docs/DESIGN.md in the
; format of docs/THEMES.md. Every other pack falls back to these values.
; distro/themes/render-packs.py builds the pack (icons, wallpaper, control
; theme, boot and installer images) from this file.

[Theme]
Id=setu-light
Name=Setu Light
Version=1
Mode=light
Base=

[Colors]
accent=#1F6FB2
accent-hover=#2A7DC3
accent-pressed=#195E97
accent-text=#FFFFFF
window-bg=#F3F3F3
surface=#FFFFFF
surface-hover=#EAEAEA
border=#D1D1D1
border-subtle=#E5E5E5
text=#1B1B1B
text-secondary=#5F5F5F
text-disabled=#A0A0A0
titlebar-active=#FFFFFF
titlebar-inactive=#F3F3F3
titlebar-text=#1B1B1B
titlebar-text-inactive=#5F5F5F
close-hover=#C42B1C
taskbar=#EEF1F5
taskbar-text=#1B1B1B
menu=#FFFFFF
selection=#1F6FB233
selection-border=#1F6FB2
shadow=#00000033
desktop=#1E4F8A
; the Setu bridge mark (docs/DESIGN.md: it stays orange): the start
; button, the boot splash and the installer
logo=#F5A623
error=#C42B1C
; lettered tiles for apps without an icon (setu-shell)
tile-1=#2F7D6A
tile-2=#5B5FC7
tile-3=#B55A3C
tile-4=#1F6FB2
tile-5=#8A6D1F
tile-6=#9B4D87

[Fonts]
ui=Inter
ui-size=9
caption-weight=600
title-size=10.5
header-size=14
mono=JetBrains Mono, Noto Sans Mono
smoothing=grayscale

[Metrics]
radius-window=8
radius-control=4
radius-check=3
caption-height=30
caption-button-width=46
taskbar-height=48
taskbar-button=40
taskbar-icon=24
row-height=32
menu-item-height=30
control-height=28
scrollbar-width=6
scrollbar-width-hover=12
focus-width=2
shadow-blur=16
taskbar-pill=3

[Shell]
taskbar-alignment=center
start-columns=6
start-rows=4

; the cursor set (art/cursors/cursorgen.py): the X cursor theme of that
; name for labwc/Xwayland and its .cur/.ani files for Windows programs
[Cursor]
theme=setu-light
size=24

; the sound scheme (art/sounds/soundgen.py), C:\Windows\Media\Setu\<scheme>
[Sounds]
scheme=setu-chimes

; The icon set (art/icons/icongen.py; all sets are installed). Names a set
; misses come from the pack's own icons/, then the shell's built-in ones.
[Icons]
set=setu-colour

[Boot]
background=#F3F3F3
logo=boot/logo.png
spinner=boot/spinner.png

; The wallpaper, drawn by artwork/wallpaper.py at build time ("silk": soft
; waves on a deep blue background with one thin ribbon in the Setu orange).
; A pack with Base=setu-light and its own colours here gets the same
; picture in its colours; ribbon-N is "light dark" (the fold's lit and
; shaded side). Instead of script=, a pack may name an item of the
; generated collection (art/wallpapers/wallgen.py): collection=<style>-
; <palette> and optionally seed=N (default 1). style: WallpaperStyle.
[Wallpaper]
script=artwork/wallpaper.py
style=10
background-dark=#06183A
background-mid=#0D3778
bloom=#2F7BD6
ribbon-1=#1F5FB4 #0B2E6B
ribbon-2=#3D86DE #123F8A
ribbon-3=#6FB0F2 #1C55A6
ribbon-4=#A9D3FA #2A6CC0
highlight=#F5A623

; Calamares branding (installer and first-boot wizard) and the boot splash
; images, drawn by artwork/branding.py at build time.
[Installer]
script=artwork/branding.py
sidebar=#EEF1F5
sidebar-text=#1B1B1B
