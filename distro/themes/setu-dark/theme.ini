; SPDX-License-Identifier: MIT OR Apache-2.0
; Setu Dark: the dark counterpart of setu-light (docs/THEMES.md). Only what
; differs is here; everything else (fonts, metrics, icon set, the artwork
; scripts) comes from Base=setu-light. Contrast (WCAG): text on surface
; 12.6:1, accent-text on accent 6.9:1, text-secondary on surface 7.1:1.

[Theme]
Id=setu-dark
Name=Setu Dark
Version=1
Mode=dark
Base=setu-light

[Colors]
; a lighter accent with dark text on it, readable on the dark surfaces
accent=#5AA9E6
accent-hover=#74B8EE
accent-pressed=#4392D1
accent-text=#0B1A2A
window-bg=#202020
surface=#2B2B2B
surface-hover=#383838
border=#454545
border-subtle=#353535
text=#F2F2F2
text-secondary=#B8B8B8
text-disabled=#767676
titlebar-active=#2B2B2B
titlebar-inactive=#202020
titlebar-text=#F2F2F2
titlebar-text-inactive=#A0A0A0
taskbar=#1C2027
taskbar-text=#F2F2F2
menu=#2B2B2B
selection=#5AA9E640
selection-border=#5AA9E6
shadow=#00000066
desktop=#0A0E15

; black cursors with a white outline (art/cursors/cursorgen.py)
[Cursor]
theme=setu-dark

[Boot]
background=#161A20

; an item of the generated collection: layered dusk hills in Setu Dark
; colours (art/wallpapers/wallgen.py)
[Wallpaper]
script=
collection=ridges-setu-dark
seed=1
background-dark=#0A0E15

[Installer]
sidebar=#1C2027
sidebar-text=#F2F2F2
