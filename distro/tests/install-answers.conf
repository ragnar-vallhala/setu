# Test-only answers for the first-boot wizard (shell syntax; read by
# distro/tests/install-smoke.sh, which types them into Calamares' users and
# remote login pages). Not used by the ISO itself.
FULLNAME="Ada Tester"
LOGIN=ada
PASSWORD=bridge-2026
HOSTNAME=ada-setu-test
# "Log in automatically" (users page, ticked by default) and "Enable remote
# login (SSH)" (remote login page, unticked by default): yes or no. The
# test also installs a second time with both set to no (--scenario).
AUTOLOGIN=yes
SSH=yes
# The pages the test leaves at their defaults; the test checks the
# installed system got them (Calamares derives the language and the
# keyboard layout from the time zone).
LOCALE=en_GB.UTF-8
KEYMAP=gb
TIMEZONE=Europe/London
