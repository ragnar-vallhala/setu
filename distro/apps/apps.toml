# Setu's default app for each file type (and the http/https protocols): the
# ProgID that app's own installer registered for it, or a Setu.<name> ProgID
# that opens the file with the app's exe when it registered none. Written
# to HKLM\Software\Classes after all installs, so it settles the conflicts
# between installers (each claims some types; the last one would win).
# Conflicts decided here are listed in docs/DEFAULT_APPS.md.
[associations]
# documents
".pdf" = "sumatrapdf"
".epub" = "sumatrapdf"
".xps" = "sumatrapdf"
".oxps" = "sumatrapdf"
".djvu" = "sumatrapdf"
".cbz" = "sumatrapdf"
".cbr" = "sumatrapdf"
".mobi" = "sumatrapdf"
".fb2" = "sumatrapdf"
# office files (LibreOffice also takes the Microsoft Office types)
".odt" = "libreoffice"
".ods" = "libreoffice"
".odp" = "libreoffice"
".odg" = "libreoffice"
".doc" = "libreoffice"
".docx" = "libreoffice"
".xls" = "libreoffice"
".xlsx" = "libreoffice"
".ppt" = "libreoffice"
".pptx" = "libreoffice"
".rtf" = "libreoffice"
".csv" = "libreoffice"
# plain text and source files
".txt" = "notepad++"
".log" = "notepad++"
".ini" = "notepad++"
".xml" = "notepad++"
".json" = "notepad++"
".md" = "notepad++"
".yaml" = "notepad++"
".yml" = "notepad++"
# web
".htm" = "firefox"
".html" = "firefox"
".xhtml" = "firefox"
"http" = "firefox"
"https" = "firefox"
# images: SumatraPDF views the common ones while ImageGlass does not run
# (owner 2026-11-09); ImageGlass keeps .ico and .avif
".png" = "sumatrapdf"
".jpg" = "sumatrapdf"
".jpeg" = "sumatrapdf"
".gif" = "sumatrapdf"
".bmp" = "sumatrapdf"
".webp" = "sumatrapdf"
".tif" = "sumatrapdf"
".tiff" = "sumatrapdf"
".ico" = "imageglass"
".avif" = "imageglass"
".svg" = "inkscape"
".xcf" = "gimp"
# audio and video
".mp4" = "vlc"
".mkv" = "vlc"
".avi" = "vlc"
".mov" = "vlc"
".webm" = "vlc"
".wmv" = "vlc"
".mp3" = "vlc"
".ogg" = "vlc"
".flac" = "vlc"
".wav" = "vlc"
".m4a" = "vlc"
".opus" = "vlc"
# passwords
".kdbx" = "keepassxc"

# Types whose default stays Windows' own handler, with an app only offered
# in "Open with": stage.py adds the app's ProgID to the type's
# OpenWithProgids and drops any default an installer set for it.
# Archives open as compressed folders, as on Windows 11 (zipfldr: .zip is
# CompressedFolder, the others ArchiveFolder; setu-files browses them),
# owner decision 2026-11-09; 7-Zip is one right-click away.
[open_with]
".zip" = "7-zip"
".7z" = "7-zip"
".rar" = "7-zip"
".tar" = "7-zip"
".gz" = "7-zip"
".tgz" = "7-zip"
".bz2" = "7-zip"
".xz" = "7-zip"
".zst" = "7-zip"
