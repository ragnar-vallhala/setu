# SPDX-License-Identifier: MIT OR Apache-2.0
#
# The default apps preinstalled in the Setu image and installer ISO
# (docs/DEFAULT_APPS.md). Owner decision 2026-11-08 (setu-m3 #146): these 14
# Windows builds plus Wine's own accessories, and nothing else (Windows
# Terminal, the 14th, is left out for now: see below).
#
# Every download is the official 64-bit Windows release from the project's
# own site or its official GitHub releases, pinned by version, URL and
# sha256. distro/apps/fetch.py caches them in build/distro/downloads/apps;
# they are never committed. distro/apps/stage.py installs them with the
# vendor's documented silent install into a staging C: drive at image build
# time (distro/build-image.sh).
#
# Per app:
#   id              short name: the cache file name, logs, screenshots
#   name            display name
#   version, url, sha256, size (bytes)
#   checksum_src    where the sha256 was checked against the vendor's own
#                   published checksum ("" when the vendor publishes none:
#                   then it was computed from the official download)
#   licence         SPDX-style summary; licence_url the vendor's text
#   source_url      the source code of exactly this release (see
#                   docs/DEFAULT_APPS.md, "Licences and source")
#   homepage        where the version and URL were taken from
#   kind            msi | nsis | inno | mozilla | sumatra | zip
#   install_args    the vendor's documented silent arguments (msi: after
#                   "msiexec /i FILE"); silent_docs links them
#   install_dir     zip: the folder the archive's top folder becomes
#   install_timeout seconds (default 600)
#   exe             the program the Start menu shortcut and the smoke test
#                   start (Windows path)
#   args            arguments the smoke test adds (%SAMPLE_*% are files
#                   distro/tests/apps-smoke.sh writes to C:\setu-apps)
#   window          regex on "class|title" of its main window (setu-probe
#                   windows), for distro/tests/apps-smoke.sh
#   window_timeout  seconds (default 90)
#   lnk             the Start menu shortcut's name when the installer makes
#                   none (zip kind; stage.py creates it in the common
#                   Programs folder)
#   known_issue     a known failure under Setu: recorded, not fatal
#   start_menu      false: installed, but its Start menu shortcuts are
#                   removed (an app that does not work yet; stage.py)
#
# Wine's built-in accessories are listed as [[builtin]]: no download, a
# Start menu shortcut with a Setu icon (distro/apps/icons.py).

