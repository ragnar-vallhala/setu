# SPDX-License-Identifier: MIT OR Apache-2.0
#
# The app compatibility manifest read by tools/compat/run.py.
#
# Only the third-party apps the owner approved are listed (docs/COMPAT.md).
# Each one is the current stable 64-bit Windows release, downloaded from its
# official site and pinned by sha256. Downloads stay in build/compat/cache
# and are never committed.
#
# Per app:
#   name, version, url, sha256, size (bytes), licence, licence_url,
#   homepage        where the version and URL were taken from
#   kind            msi | nsis | inno | mozilla | exe (a single binary copied
#                   into the prefix) | zip (a portable zip extracted there)
#   install_args    the vendor's documented silent-install arguments (for
#                   msi: after "msiexec /i FILE"); silent_docs links them
#   install_dir     exe/zip kinds: where the file is put (Windows path)
#   install_timeout seconds
#   large           true: only on manual CI dispatch (download size)
#   files           files the install must create (Windows paths)
#   uninstall_name  regex on the DisplayName of the Uninstall registry key
#   lnk             regex on the path of the Start Menu .lnk (under
#                   ...\Start Menu\Programs)
#   uninstall_args  appended to the key's UninstallString when the key has
#                   no QuietUninstallString (MSI: "msiexec /x {GUID}" is used)
#   [app.write]     files to write after the install: Windows path = text
#   [app.launch]
#     exe           the installed program to start
#     args          its arguments; %SAMPLE_TXT%, %SAMPLE_SVG%, %SAMPLE_HTML%
#                   are files run.py writes into C:\setu-compat
#     window        regex on "class|title" that the app's main window
#                   must match ("" for console programs)
#     console       true: a console program; pass = exit code 0 and its
#                   output matching `output`
#     dismiss       first-run prompts without a Cancel button, which ignore
#                   WM_CLOSE: { "regex on class|title" = "button text" }
#     output        console: regex its output must match
#     timeout       seconds to wait for the window (default 60)
#     alive         seconds it must stay running (default 10)
#   runtimes        runtimes from [runtime.*] the app needs in its prefix
#
# Runtimes: Wine add-ons the owner approved for test prefixes. They are put
# in the prefix's Wine download cache ($XDG_CACHE_HOME/wine), where
# wineboot finds and installs them; apps without them run with mscoree
# disabled, so no download prompt can appear.

[runtime.wine-mono]
# the version and sha256 personality/wine/dlls/appwiz.cpl/addons.c expects
# (MONO_VERSION, MONO_SHA); owner approval 2026-11-06 (setu-m3 #27)
version = "10.4.1"
url = "https://dl.winehq.org/wine/wine-mono/10.4.1/wine-mono-10.4.1-x86.msi"
sha256 = "071f4b2887e1c97a11d791ff3d65be9429eed6dec4c2708888bfd546ba358e23"
size = 85504000
file = "wine-mono-10.4.1-x86.msi"
licence = "MIT, parts GPL / LGPL"
licence_url = "https://wiki.winehq.org/Mono"

[[app]]
name = "winsw"
version = "2.12.0"
url = "https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe"
sha256 = "05b82d46ad331cc16bdc00de5c6332c1ef818df8ceefcd49c726553209b3a0da"
size = 18243033
licence = "MIT"
licence_url = "https://github.com/winsw/winsw/blob/v2.12.0/LICENSE.txt"
homepage = "https://github.com/winsw/winsw/releases/tag/v2.12.0"
kind = "exe"
install_dir = 'C:\Program Files\WinSW'
install_args = []
silent_docs = "https://github.com/winsw/winsw/blob/v2.12.0/README.md"
files = ['C:\Program Files\WinSW\WinSW-x64.exe']
# WinSW reads <exe name>.xml next to itself before any command
[app.write]
'C:\Program Files\WinSW\WinSW-x64.xml' = '''
<service>
  <id>SetuCompatWinSW</id>
  <name>Setu compat WinSW</name>
  <description>Setu compatibility check (never installed).</description>
  <executable>C:\windows\system32\cmd.exe</executable>
</service>
'''
[app.launch]
exe = 'C:\Program Files\WinSW\WinSW-x64.exe'
# queries the service manager: the service doesn't exist
args = ["status"]
console = true
output = '^NonExistent'

